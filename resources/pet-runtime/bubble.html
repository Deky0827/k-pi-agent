<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #text {
    width: 100%; height: 100%; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: rgba(30, 30, 38, 0.94); color: #f2f2f6;
    border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px;
    font: 12.5px/1.4 "Segoe UI", "Microsoft YaHei", sans-serif;
    text-align: center; padding: 4px 8px; overflow: hidden;
  }
  #text::after {
    content: ""; position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: rgba(30, 30, 38, 0.94); border-bottom: 0;
  }
</style>
</head>
<body>
<div id="text"></div>
<script>
const el = document.getElementById("text");
window.kAgent.onBubbleText((text) => { el.textContent = text; });
</script>
</body>
</html>
