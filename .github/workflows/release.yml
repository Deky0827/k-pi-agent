name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org/
      - run: npm run typecheck
      - run: npm test
      - run: npm run prepare:payload
      - run: npm audit --prefix resources/seed/pi-web --omit=dev --registry=https://registry.npmjs.org/
      - run: npm run smoke:payload
      - run: npm run dist:installer
      - name: Generate checksum and publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/K pi agent-Setup-$version-x64.exe"
          $blockmap = "$installer.blockmap"
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "K pi agent $version" --notes-file RELEASE_NOTES.md --prerelease
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag $installer $blockmap --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $assetName = $release.assets | Where-Object { $_.name -like "*Setup-$version-x64.exe" } | Select-Object -First 1 -ExpandProperty name
          if (!$assetName) { throw "GitHub release installer asset was not found for $tag" }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
          gh release upload $tag SHA256SUMS.txt --clobber
