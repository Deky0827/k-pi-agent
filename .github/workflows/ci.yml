name: Windows checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org/
      - run: npm run typecheck
      - run: npm test
      - run: npm run prepare:payload
      - run: npm audit --prefix resources/seed/pi-web --omit=dev --registry=https://registry.npmjs.org/
      - run: npm run smoke:payload
      - run: npm run dist:installer
